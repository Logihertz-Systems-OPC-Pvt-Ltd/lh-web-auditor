[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-web-auditor"
version = "0.1.0"
description = "Asynchronous defensive web configuration auditor developed by Logihertz Systems OPC Pvt Ltd"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Logihertz Systems OPC Pvt Ltd", email = "info@logihertz.com" }
]
keywords = ["security", "audit", "headers", "cookies", "cors", "tls", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-web-auditor"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-web-auditor"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-web-auditor#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-web-auditor/issues"

[project.scripts]
lh-auditor = "lh_web_auditor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_web_auditor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # do not perform function calls in argument defaults (Typer Option/Argument pattern)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []
